services:
  catalog-postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: catalog_command_db
      POSTGRES_USER: catalog_app
      POSTGRES_PASSWORD: catalog_password
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog_app -d catalog_command_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  effective-menu-postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: effective_menu_db
      POSTGRES_USER: effective_menu_app
      POSTGRES_PASSWORD: effective_menu_password
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U effective_menu_app -d effective_menu_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    hostname: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://broker:19092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12

  catalog-service:
    build:
      context: ../global-food-catalog-platform
    ports:
      - "8080:8080"
    environment:
      CATALOG_DB_URL: jdbc:postgresql://catalog-postgres:5432/catalog_command_db
      CATALOG_DB_USERNAME: catalog_app
      CATALOG_DB_PASSWORD: catalog_password
      CATALOG_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      CATALOG_KAFKA_MENU_ITEM_TOPIC: catalog.menu-item.changed
    depends_on:
      catalog-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  effective-menu-service:
    build:
      context: ../effective-menu-service
    ports:
      - "8081:8081"
    environment:
      EFFECTIVE_MENU_DB_URL: jdbc:postgresql://effective-menu-postgres:5432/effective_menu_db
      EFFECTIVE_MENU_DB_USERNAME: effective_menu_app
      EFFECTIVE_MENU_DB_PASSWORD: effective_menu_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      MENU_ITEM_CHANGED_TOPIC: catalog.menu-item.changed
    depends_on:
      effective-menu-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8081/actuator/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
